# Nginx | LeadsThru | TLS termination + reverse proxy + WebSocket (Socket.IO)
#
# Zero-downtime: `nginx -s reload` (or `systemctl reload nginx`) spawns new
# workers and gracefully drains old ones. Combined with PM2 cluster reload,
# deploys do not drop in-flight requests.

upstream leadsthru_api {
    # PM2 binds the cluster to a single port; OS load-balances across workers.
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.leadsthru.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.leadsthru.com;

    # TLS (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/app.leadsthru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.leadsthru.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (HIPAA-aligned baseline)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 50M;          # medical record uploads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Frontend (static React build, served from atomic symlink)
    root /var/www/leadsthru/current/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API
    location /api/ {
        proxy_pass         http://leadsthru_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Socket.IO (realtime) | WebSocket upgrade
    location /socket.io/ {
        proxy_pass         http://leadsthru_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Health probe (used by GitHub Actions smoke tests + load balancer)
    location = /health {
        proxy_pass http://leadsthru_api/health;
        access_log off;
    }
}
